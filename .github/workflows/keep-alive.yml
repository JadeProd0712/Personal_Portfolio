name: Keep backend awake

on:
  schedule:
    - cron: '3-59/10 * * * *'   # every 10 minutes (Render sleeps after 15)
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health page
        env:
          URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "BACKEND_HEALTH_URL is not set yet, skipping"; exit 0; fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "$URL"